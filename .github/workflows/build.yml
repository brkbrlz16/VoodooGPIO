
name: Build VoodooGPIO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout VoodooGPIO
        uses: actions/checkout@v4

      - name: Checkout MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          path: MacKernelSDK

      - name: Build VoodooGPIO
        run: |
          xcodebuild \
            -project VoodooGPIO.xcodeproj \
            -scheme VoodooGPIO \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload compiled kext
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-kext
          path: build/Build/Products/Release/VoodooGPIO.kext
