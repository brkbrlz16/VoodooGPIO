
name: Build VoodooGPIO for macOS Tahoe

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout VoodooGPIO
        uses: actions/checkout@v4

      - name: Install MacKernelSDK
        run: |
          git clone --depth 1 \
            https://github.com/acidanthera/MacKernelSDK.git \
            "$GITHUB_WORKSPACE/../../MacKernelSDK"

      - name: Verify dependencies
        run: |
          test -f "$GITHUB_WORKSPACE/../../MacKernelSDK/Headers/IOKit/IOLib.h"
          test -f "$GITHUB_WORKSPACE/../../MacKernelSDK/Library/x86_64/libkmod.a"
          echo "MacKernelSDK dependencies verified."

      - name: Build VoodooGPIO
        run: |
          xcodebuild \
            -project VoodooGPIO.xcodeproj \
            -scheme VoodooGPIO \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload VoodooGPIO.kext
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VoodooGPIO-Tahoe
          path: build/Build/Products/Release/VoodooGPIO.kext
